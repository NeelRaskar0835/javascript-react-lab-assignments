
name: Deploy Lab Assignments to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare website folders
        run: |
          mkdir -p site/assignment-1 site/assignment-2 site/assignment-3
          mkdir -p site/assignment-4 site/assignment-5 site/assignment-6

      - name: Copy HTML assignments
        run: |
          cp -R "Assignment 1/." site/assignment-1/
          cp -R "Assignment 2/." site/assignment-2/
          cp -R "Assignment 3/." site/assignment-3/

      - name: Build Assignment 4
        working-directory: Assignment 4
        run: npm ci && npm run build

      - name: Copy Assignment 4
        run: cp -R "Assignment 4/dist/." site/assignment-4/

      - name: Build Assignment 5
        working-directory: Assignment 5
        run: npm ci && npm run build

      - name: Copy Assignment 5
        run: cp -R "Assignment 5/dist/." site/assignment-5/

      - name: Build Assignment 6
        working-directory: Assignment 6
        run: npm ci && npm run build

      - name: Copy Assignment 6
        run: cp -R "Assignment 6/dist/." site/assignment-6/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
